# BetterModel Animations Reference Guide
# This file lists all available animations and how to use them.

# ========================================
# BUILT-IN ANIMATIONS (Auto-triggered)
# ========================================
# These are automatically triggered by BetterModel based on entity state:

built_in_animations:
  JUMP:
    description: Triggered when entity jumps
    use_case: Automatically animated when entity performs jump action
    how_to_use: "BetterModel handles this automatically - no manual call needed"
    
  DAMAGE:
    description: Triggered when entity takes damage
    use_case: Plays when entity receives damage
    how_to_use: "BetterModel handles this automatically - no manual call needed"
    
  DEATH:
    description: Triggered when entity dies
    use_case: Plays when entity dies/is killed
    how_to_use: "BetterModel handles this automatically - no manual call needed"

# ========================================
# CUSTOM ANIMATIONS (Model-specific)
# ========================================
# These are defined in your .bbmodel files and vary by model.
# Examples from included BetterModel test models:

custom_animations_examples:
  
  # Steve Player Model (from steve.bbmodel)
  steve:
    animations:
      - roll
      - walk
    description: Default player model with basic animations
    
  # Demon Knight (from demon_knight.bbmodel)
  demon_knight:
    animations:
      - attack_pose
      - idle
      - walk
    description: Knight model with combat animations
    
  # Blue Wizard (from blue_wizard.bbmodel)
  blue_wizard:
    animations:
      - cast_spell
      - idle
      - walk
    description: Wizard model with spell-casting animation

# ========================================
# HOW TO USE ANIMATIONS IN CODE
# ========================================

usage_examples:
  
  # Playing an animation on a tracker
  simple_animate:
    code: |
      tracker.animate("roll", AnimationModifier.DEFAULT_WITH_PLAY_ONCE);
    explanation: Plays "roll" animation once and stops. Parameter "roll" is the animation name from your model.
    
  # Playing animation with callback (when animation ends)
  animate_with_callback:
    code: |
      tracker.animate("roll", AnimationModifier.DEFAULT_WITH_PLAY_ONCE, () -> {
        // Code here runs when animation finishes
        tracker.close(); // Example: remove tracker after animation
      });
    explanation: Plays animation and executes callback function when it finishes.
    
  # Getting animation metadata
  get_animation_info:
    code: |
      float length = BetterModel.limb("steve")
          .flatMap(r -> r.animation("roll"))
          .map(BlueprintAnimation::length)
          .orElse(0F);
    explanation: Gets the duration (in seconds) of an animation without spawning it.
    
  # Playing animation only for specific player
  per_player_animation:
    code: |
      AnimationModifier modifier = AnimationModifier.builder()
          .player(player)
          .type(AnimationIterator.Type.PLAY_ONCE)
          .build();
      tracker.animate("attack_pose", modifier);
    explanation: Animation only visible to one specific player (great for cutscenes/UI).

# ========================================
# ANIMATION MODIFIERS
# ========================================

animation_modifiers:
  
  DEFAULT_WITH_PLAY_ONCE:
    description: Plays animation once, server-side
    usage: "AnimationModifier.DEFAULT_WITH_PLAY_ONCE"
    
  DEFAULT:
    description: Default modifier, repeating/looping
    usage: "AnimationModifier.DEFAULT"
    
  BUILDER:
    description: Create custom modifier with specific settings
    usage: "AnimationModifier.builder().player(player).type(...).build()"
    parameters:
      player: "Optional - specific player to show animation to"
      type: "AnimationIterator.Type - PLAY_ONCE, LOOP, etc."

# ========================================
# FINDING AVAILABLE ANIMATIONS
# ========================================

finding_animations:
  method_1:
    description: Use /bm play command in-game
    command: "/bm play <limb_name> <animation_name>"
    example: "/bm play steve roll"
    note: "Requires BetterModel plugin with command enabled"
    
  method_2:
    description: Check model file (.bbmodel) directly
    format: "BlockBench JSON format - look for 'animation' sections"
    note: "Open .bbmodel files in BlockBench or text editor"
    
  method_3:
    description: In your code, use ModelRenderer.animation()
    code: |
      BetterModel.model("demon_knight")
          .ifPresent(renderer -> renderer.animations().forEach(anim -> 
              System.out.println("Animation: " + anim.name())
          ));
    note: "Prints all available animations for a model"

# ========================================
# COMMON ANIMATION NAMES
# ========================================

common_animation_names:
  combat:
    - attack
    - attack_pose
    - slash
    - cast_spell
    - defend
    
  movement:
    - walk
    - run
    - jump
    - fall
    - idle
    - stand
    
  emotion:
    - dance
    - laugh
    - cry
    - wave
    - bow
    
  custom:
    - roll
    - flip
    - spin
    - any_custom_name_you_define

# ========================================
# TIPS & BEST PRACTICES
# ========================================

best_practices:
  
  tip_1:
    title: "Always close trackers"
    description: "Call tracker.close() when done to prevent ghost models and memory leaks"
    
  tip_2:
    title: "Use EntityHideOption.FALSE for non-hiding models"
    description: "If you want model visible alongside player, use EntityHideOption.FALSE"
    
  tip_3:
    title: "Check animation exists before playing"
    description: "Use .animation(name) to verify animation exists before .animate() call"
    
  tip_4:
    title: "Animation names are case-sensitive"
    description: "Use exact name from model - 'roll' is not the same as 'Roll'"
    
  tip_5:
    title: "Use AnimationIterator.Type for control"
    description: "Set PLAY_ONCE for one-off anims, LOOP for repeating ones"

# ========================================
# ANIMATION COMMAND REFERENCE
# ========================================

commands:
  bm_test:
    command: "/bm test <model> <animation> [player] [location]"
    description: "Test a model animation in-world"
    example: "/bm test demon_knight attack_pose @s"
    
  bm_play:
    command: "/bm play <limb> <animation> [loop_type] [hide]"
    description: "Play a limb/player animation"
    example: "/bm play steve roll"

# ========================================
# CREATING CUSTOM ANIMATIONS
# ========================================

creating_custom:
  tool: "BlockBench (blockbench.net)"
  steps:
    1: "Open or create a .bbmodel file in BlockBench"
    2: "Design your model geometry/bones"
    3: "Go to Animations tab (left side)"
    4: "Click '+' to create new animation"
    5: "Set animation name (e.g., 'attack_pose')"
    6: "Add keyframes for each bone movement"
    7: "Export model as .bbmodel"
    8: "Place in BetterModel/models/ folder"
  note: "Animation names must match what you use in code (.animate('name'))"
