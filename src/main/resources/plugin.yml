name: WonderPlugin
version: 1.2.5
main: com.alb.wonderplugin.WonderPlugin
author: alb
api-version: 1.26
folia-supported: true
description: An umbrella plugin with modular features.

commands:
  wp:
    description: WonderPlugin umbrella command
    usage: /wp <owner|history> #<player>, /wp owned, /wp owned h, /wp ch owner
    permission: wp.owner

  addpump:
    description: Register a new Pump boss
    usage: /addpump <model_name> <base_mob>
    permission: wp.bosses
  droppump:
    description: Add a drop to a Pump boss
    usage: /droppump <model_name> <chance>
    permission: wp.bosses
  boss:
    description: Debug boss drops
    usage: /boss <model_name> <drop|dropall|spawn>
    permission: wp.bosses
  creep:
    description: WonderPlugin umbrella command
    usage: /creep
    permission: wp.creep

  follow:
    description: "Summon a BetterModel follower"
    usage: "/follow <model_name> | /follow stop"
    aliases: [follower]
    permission: wp.follow

  clearfollow:
    description: "Remove your current BetterModel follower"
    usage: "/clearfollow"
    aliases: [rmfollow, stopfollow]
    permission: wp.follow

  addfollower:
    description: "Add a model to allowed followers list"
    usage: "/addfollower <model_name>"
    permission: wp.follower.admin

  spnr:
    description: Spawner tracking command
    usage: /spnr check | /spnr set <player_name> | /spnr change <player_name> | /spnr break
    permission: wp.spnr

  spwn:
    description: Toggle spawner on/off
    usage: /spwn <on|off>

  cb:
    description: Highlight chunk border with temporary glass
    usage: /cb

  bham:
    description: Mark the item in your hand as a Ban Hammer
    usage: /bham
    permission: wonderplugin.bham

  fb:
    description: Toggle Fullbright (Night Vision)
    usage: /fbright <on|off>

  statue:
    description: Statue management command
    usage: /<command> add
    permission: statue

  anvilwatch:
    description: Manage AnvilWatch plugin
    usage: /<command> <help|reload|add|remove|log> <args>
    aliases: [ anw, aw ]

  modelbreak:
    description: Break the closest statue within 2 blocks
    usage: /modelbreak

  modeldisplay:
    description: Display a statue model from the item in hand
    usage: /modeldisplay

  find:
    description: Search claim containers for an item
    usage: /find <item>
    permission: wp.finder

  findname:
    description: Search claim containers by item display name
    usage: /findname <display name>
    permission: wp.finder.name

permissions:
  wp.owner:
    description: Allows setting item ownership
    default: op
  wp.spnr:
    description: Allows checking spawner ownership
    default: op
  wp.spnr.admin:
    description: Full spawner admin rights (bypass all restrictions)
    default: op
  wp.creep.admin:
    description: Allows configuring creeper spawner charge percentage
    default: op
  statue:
    description: Allows use of /statue commands
    default: op
  statue.display:
    description: Allows setting item display
    default: op
  anvilwatch.admin:
    description: Receive anvil rename logs and manage plugin
    default: op
  anvilwatch.bypass:
    description: Bypass banned word restrictions
    default: op
  aw.bp:
    description: Bypass blocked custom textures
    default: op
  wonderplugin.bham:
    description: Allows a player to mark an item as a Ban Hammer
    default: op
  wp.finder:
    description: Allows use of /find command to search claim containers
    default: op
  wp.finder.name:
    description: Allows use of /findname command to search items by name inside claim containers
    default: op
  wp.follow:
    description: Allows use of /follow and /clearfollow commands
    default: op
  wp.follower.admin:
    description: Allows managing allowed follower models
    default: op
  wp.bosses:
    description: Allows registering pump bosses
    default: op